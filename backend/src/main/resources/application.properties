spring.application.name=local-knowledge-ai

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/local_knowledge_ai
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Local secrets (not committed to Git)
spring.config.import=optional:file:./application-local.properties

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway (disabled during connection test)
spring.flyway.enabled=true

# Server
server.port=8080

# Spring AI / Ollama
spring.ai.ollama.base-url=http://localhost:11434

# Chat Model
spring.ai.model.chat=ollama
spring.ai.ollama.chat.model=qwen3:4b

# Embedding Model
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=qwen3-embedding:0.6b

# Models are already downloaded locally
spring.ai.ollama.init.pull-model-strategy=never
